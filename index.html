<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Tempo | Digital Clock</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<main class="clock-shell">
		<div class="ambient ambient-one" aria-hidden="true"></div>
		<div class="ambient ambient-two" aria-hidden="true"></div>

		<section class="clock-card" aria-label="Digital clock">
			<header class="clock-header">
				<div class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></div>
				<p class="eyebrow">Local time</p>
				<p class="location"><span class="pulse-dot"></span><span id="timezone">Your timezone</span></p>
			</header>

			<div class="clock-display">
				<p class="date" id="date">Thursday, September 11</p>
				<div class="time-row" aria-live="polite">
					<time class="time" id="time">00:00:00</time>
					<span class="period" id="period">AM</span>
				</div>
			</div>

			<footer class="clock-footer">
				<span>Live sync</span>
				<span class="footer-line"></span>
				<span id="seconds-label">Seconds moving</span>
			</footer>
		</section>

		<p class="page-note">A quiet moment, precisely measured.</p>
	</main>
	<script src="script.js"></script>
</body>
</html>
